name: Bug report
description: Report a reproducible failure (no sensitive typing samples)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never share passwords, private messages, raw keystrokes or sensitive logs."
  - type: input
    id: version
    attributes:
      label: KeyMind version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and application
      placeholder: "Windows 11 / Notepad"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps (use fictional, nonsensitive text)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and actual result
    validations:
      required: true
